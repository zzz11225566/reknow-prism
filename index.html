<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="炼知 ReKnow：把知乎收藏拆成可理解、可迁移、可重建的个人知识宇宙。"
    />
    <title>炼知 ReKnow · 知识炼金场</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="topbar" id="topbar">
        <div class="topbar-inner">
          <button class="brand" id="brandHome" type="button" aria-label="返回收藏拆解">
            <span class="brand-mark" aria-hidden="true">
              <span></span>
            </span>
            <span class="brand-copy">
              <strong>炼知</strong>
              <small>ReKnow</small>
            </span>
          </button>

          <nav class="main-nav" aria-label="主导航">
            <button class="nav-item is-active" id="viewWorkspace" type="button">
              <span class="icon" data-icon="library"></span>
              <span>收藏拆解</span>
            </button>
            <button class="nav-item" id="viewUniverse" type="button">
              <span class="icon" data-icon="orbit"></span>
              <span>炼金宇宙</span>
            </button>
          </nav>

          <div class="topbar-status">
            <span class="connection-pill" id="connectionPill">
              <span class="status-dot"></span>
              <span>知乎已连接</span>
            </span>
            <span class="level-pill" title="炼金进度">
              <span class="icon" data-icon="flame"></span>
              <span id="levelLabel">炼金学徒</span>
              <span class="level-track"><i id="levelBar"></i></span>
            </span>
            <button class="icon-button" id="openSettings" type="button" aria-label="个性化设置" title="个性化设置">
              <span class="icon" data-icon="sliders"></span>
            </button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section class="view workspace-view is-active" id="workspaceView">
          <div class="workspace-grid">
            <section class="section-block theme-section" aria-labelledby="themeHeading">
              <div class="section-heading">
                <div>
                  <span class="section-kicker">AI 主题聚类</span>
                  <h2 id="themeHeading">文章主题归类</h2>
                  <p class="section-description">
                    每篇文章都归入一个可调整的知识主题，点击主题进入文章拆解。
                  </p>
                </div>
                <div class="section-heading-actions">
                  <span class="sync-caption">收藏同步于 <span id="syncTime">刚刚</span></span>
                  <button class="button button-quiet" id="syncCollections" type="button">
                    <span class="icon" data-icon="refresh"></span>
                    同步收藏
                  </button>
                  <button class="button button-primary" id="newThemeButton" type="button">
                    <span class="icon" data-icon="plus"></span>
                    新建类别
                  </button>
                </div>
              </div>
              <div class="theme-grid" id="themeGrid"></div>
            </section>
          </div>
        </section>

        <section class="view collection-view" id="collectionView">
          <div class="collection-page">
            <header class="collection-page-head">
              <div>
                <span class="section-kicker" id="collectionKicker">当前主题</span>
                <h1 id="collectionHeading">收藏文章</h1>
              </div>
              <button class="region-icon-button" id="openThemeSettings" type="button" aria-label="主题小设置" title="主题小设置">
                <span class="icon" data-icon="settings"></span>
              </button>
          <button class="region-settings-button" id="openThemeBoard" type="button">
            <span class="icon" data-icon="layout"></span>
            无边记
          </button>
            </header>
            <section class="section-block collection-block" aria-label="主题文章">
              <div class="section-heading collection-heading">
                <div>
                  <span class="section-kicker">主题内容</span>
                  <h2>收藏文章</h2>
                </div>
                <div class="collection-tools">
                  <div class="search-field compact">
                    <span class="icon" data-icon="search"></span>
                    <input id="collectionSearch" type="search" placeholder="搜索文章、答主或标签" />
                  </div>
                  <div class="segmented" id="statusFilter" aria-label="文章状态筛选">
                    <button class="is-active" data-status="all" type="button">全部</button>
                    <button data-status="seed" type="button">待拆解</button>
                    <button data-status="planet" type="button">已加入</button>
                    <button data-status="lit" type="button">已掌握</button>
                  </div>
                </div>
              </div>
              <div class="article-list" id="articleList"></div>
            </section>
          </div>
        </section>

        <section class="view article-view" id="articleView">
          <div class="article-topline">
            <button class="back-button" id="backToWorkspace" type="button">
              <span class="icon" data-icon="arrow-left"></span>
              返回
            </button>
            <form class="article-ai-bar" id="articleAiForm">
              <span class="icon" data-icon="message-circle"></span>
              <input
                id="articleAiInput"
                type="text"
                placeholder="问 AI，或在“AI 抬杠”里输入“我学会了”…"
                autocomplete="off"
              />
              <button type="submit">发送</button>
            </form>
            <div class="article-top-actions">
              <div class="article-top-meta" id="articleTopMeta"></div>
              <button class="region-icon-button" id="openArticleSettings" type="button" aria-label="文章小设置" title="文章小设置">
                <span class="icon" data-icon="settings"></span>
              </button>
            </div>
          </div>
          <div class="article-ai-response" id="articleAiResponse" hidden></div>
          <div class="article-layout">
            <aside class="article-sidebar">
              <div id="articleIdentity"></div>
              <nav class="step-nav" id="stepNav" aria-label="文章拆解步骤"></nav>
              <div class="sidebar-note">
                <span class="icon" data-icon="sparkles"></span>
                <p>步骤不是阅读清单，而是一条从“作者说了什么”到“我能如何使用”的重建路径。</p>
              </div>
            </aside>
            <div class="article-content-column">
              <article class="analysis-stage" id="analysisStage"></article>
              <aside class="insight-panel">
                <div class="insight-head">
                  <span>炼金札记</span>
                  <button class="text-button" id="clearNotes" type="button">清空</button>
                </div>
                <div class="notes-list" id="notesList"></div>
                <form class="note-form" id="noteForm">
                  <textarea
                    id="noteInput"
                    rows="3"
                    placeholder="记录你的疑问、反例或可迁移场景…"
                  ></textarea>
                  <button class="button button-primary button-full" type="submit">
                    <span class="icon" data-icon="plus"></span>
                    加入札记
                  </button>
                </form>
              </aside>
            </div>
          </div>
        </section>

        <section class="view universe-view" id="universeView" aria-label="炼金宇宙">
          <canvas id="universeCanvas"></canvas>
          <div class="universe-atmosphere" aria-hidden="true"></div>

          <div class="universe-hud" id="universeHud">
            <div class="universe-topbar">
              <button class="universe-brand" id="universeHome" type="button">
                <span class="brand-mark small" aria-hidden="true"><span></span></span>
                <span><strong>炼金宇宙</strong><small>主题是星系，文章是行星</small></span>
              </button>

              <div class="universe-search-wrap">
                <div class="universe-search">
                  <span class="icon" data-icon="search"></span>
                  <input
                    id="universeSearch"
                    type="search"
                    placeholder="搜索知乎内容，或找到你的星球"
                    autocomplete="off"
                  />
                  <button id="runUniverseSearch" type="button">搜索</button>
                </div>
                <div class="universe-mode" id="universeMode">
                  <button class="is-active" data-mode="zhihu" type="button">知乎内容</button>
                  <button data-mode="mine" type="button">我的宇宙</button>
                </div>
              </div>

              <div class="universe-actions">
                <span class="universe-counter" id="universeCounter">0 个星系 · 0 颗行星</span>
                <button class="universe-icon-button" id="openUniverseSettings" type="button" aria-label="炼金宇宙中心设置" title="炼金宇宙中心设置">
                  <span class="icon" data-icon="sliders"></span>
                </button>
                <button class="universe-icon-button" id="resetUniverseCamera" type="button" aria-label="重置视角" title="重置视角">
                  <span class="icon" data-icon="maximize"></span>
                </button>
                <button class="universe-icon-button" id="closeUniverse" type="button" aria-label="返回收藏拆解" title="返回收藏拆解">
                  <span class="icon" data-icon="x"></span>
                </button>
              </div>
            </div>

            <div class="universe-breadcrumb" id="universeBreadcrumb"></div>

            <aside class="universe-legend" id="universeLegend">
              <span><i class="legend-dot planet"></i>行星</span>
              <span><i class="legend-dot mastered"></i>已掌握</span>
              <span><i class="legend-ring"></i>当前主题</span>
            </aside>

            <aside class="universe-panel" id="universePanel">
              <div class="panel-heading">
                <div>
                  <span class="panel-kicker" id="universePanelKicker">知乎搜索</span>
                  <h3 id="universePanelTitle">发现可炼化的知识</h3>
                </div>
                <button class="icon-button dark" id="closeUniversePanel" type="button" aria-label="关闭面板">
                  <span class="icon" data-icon="x"></span>
                </button>
              </div>
              <div class="universe-panel-body" id="universePanelBody"></div>
            </aside>

            <div class="planet-card" id="planetCard" hidden></div>
            <div class="universe-empty" id="universeEmpty" hidden></div>
            <div class="universe-loading" id="universeLoading">
              <span class="loading-seal"><i></i></span>
              <p>正在点亮你的知识星系…</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="fixed-nav-dock" id="fixedNavDock">
      <button class="fixed-nav-button" id="navPrevious" type="button" aria-label="返回上一界面" title="返回上一界面">
        <span class="icon" data-icon="arrow-left"></span>
      </button>
      <button class="fixed-nav-button" id="navHome" type="button" aria-label="返回主页" title="返回主页">
        <span class="icon" data-icon="home"></span>
      </button>
    </div>

    <button class="guide-compass" id="guideCompass" type="button" aria-label="打开模块指南" title="模块指南">
      <span class="compass-ring"><i></i></span>
      <span class="guide-compass-label">指南</span>
    </button>

    <dialog class="guide-dialog" id="guideDialog">
      <article class="guide-card">
        <header class="dialog-head">
          <div>
            <span class="section-kicker" id="guideKicker">模块指南</span>
            <h2 id="guideTitle">使用指南</h2>
          </div>
          <button class="icon-button" id="closeGuideButton" type="button" aria-label="关闭指南">
            <span class="icon" data-icon="x"></span>
          </button>
        </header>
        <div class="guide-body" id="guideBody"></div>
      </article>
    </dialog>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog" class="settings-card" id="settingsForm">
        <div class="dialog-head">
          <div>
            <span class="section-kicker" id="settingsKicker">中心设置</span>
            <h2 id="settingsTitle">收藏拆解</h2>
          </div>
          <button class="icon-button" id="closeSettingsButton" type="button" aria-label="关闭设置">
            <span class="icon" data-icon="x"></span>
          </button>
        </div>
        <div class="settings-body" id="centerSettingsBody"></div>
        <div class="settings-actions">
          <button class="button button-quiet" id="resetDemo" type="button">恢复演示数据</button>
          <button class="button button-primary" id="saveSettings" value="default" type="submit">
            保存设置
          </button>
        </div>
      </form>
    </dialog>

    <dialog class="settings-dialog small-settings-dialog" id="smallSettingsDialog">
      <form method="dialog" class="settings-card" id="smallSettingsForm">
        <div class="dialog-head">
          <div>
            <span class="section-kicker">区域小设置</span>
            <h2 id="smallSettingsTitle">当前区域</h2>
          </div>
          <button class="icon-button" id="closeSmallSettingsButton" type="button" aria-label="关闭设置">
            <span class="icon" data-icon="x"></span>
          </button>
        </div>
        <div class="settings-body" id="smallSettingsBody"></div>
        <div class="settings-actions">
          <button class="button button-quiet" id="resetSmallSettings" type="button">恢复继承</button>
          <button class="button button-primary" type="submit">应用</button>
        </div>
      </form>
    </dialog>

    <dialog class="settings-dialog theme-create-dialog" id="themeCreateDialog">
      <form method="dialog" class="settings-card" id="themeCreateForm">
        <div class="dialog-head">
          <div>
            <span class="section-kicker">主题归类</span>
            <h2>新建类别</h2>
          </div>
          <button class="icon-button" id="closeThemeCreateButton" type="button" aria-label="关闭">
            <span class="icon" data-icon="x"></span>
          </button>
        </div>
        <div class="settings-body">
          <label class="field">
            <span>类别名称</span>
            <input id="themeNameInput" maxlength="16" placeholder="例如：产品设计、家庭理财、周末游戏" />
          </label>
          <div class="settings-section">
            <label>选择图标</label>
            <div class="icon-choice-grid" id="themeIconChoices"></div>
          </div>
          <label class="field">
            <span>主题色</span>
            <div class="color-choice-grid" id="themeColorChoices"></div>
          </label>
        </div>
        <div class="settings-actions">
          <button class="button button-quiet" id="cancelThemeCreate" type="button">取消</button>
          <button class="button button-primary" type="submit">创建类别</button>
        </div>
      </form>
    </dialog>

    <dialog class="board-dialog" id="boardDialog">
      <div class="board-shell">
        <header class="board-topbar">
          <div class="board-title">
            <span class="icon" data-icon="layout"></span>
            <strong id="boardTitle">无边记</strong>
          </div>
          <div class="board-tools" id="boardTools">
            <button data-board-tool="select" class="is-active" type="button" title="选择">
              <span class="icon" data-icon="mouse-pointer"></span>
            </button>
            <button data-board-tool="note" type="button" title="便签">
              <span class="icon" data-icon="sticky-note"></span>
            </button>
            <button data-board-tool="text" type="button" title="文本">
              <span class="icon" data-icon="type"></span>
            </button>
            <button data-board-tool="rect" type="button" title="矩形">
              <span class="icon" data-icon="square"></span>
            </button>
            <button data-board-tool="pen" type="button" title="画笔">
              <span class="icon" data-icon="pencil"></span>
            </button>
            <button data-board-tool="erase" type="button" title="橡皮">
              <span class="icon" data-icon="eraser"></span>
            </button>
            <button id="boardUndo" type="button" title="撤销">
              <span class="icon" data-icon="undo"></span>
            </button>
          </div>
          <div class="board-actions">
            <button id="boardZoomOut" type="button" title="缩小">−</button>
            <span id="boardZoomLabel">100%</span>
            <button id="boardZoomIn" type="button" title="放大">+</button>
            <button id="boardClose" type="button" title="关闭">
              <span class="icon" data-icon="x"></span>
            </button>
          </div>
        </header>
        <div class="board-workspace" id="boardWorkspace">
          <div class="board-grid"></div>
          <div class="board-canvas" id="boardCanvas"></div>
        </div>
      </div>
    </dialog>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <script src="vendor/three.min.js"></script>
    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="universe.js"></script>
  </body>
</html>
